name: Opt-in container deployment
on:
  workflow_call:
    inputs:
      image_digest:
        description: SHA-256 digest of a previously published image.
        required: true
        type: string
      source_sha:
        description: Full source commit SHA associated with the image.
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: real-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit opt-in and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.REAL_DEPLOY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REF_NAME" = "refs/heads/$DEFAULT_BRANCH"
          test "$ENABLED" = true || { echo "REAL_DEPLOY_ENABLED must be true." >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          protected=$(gh api "repos/$GITHUB_REPOSITORY/environments/real-prod" \
            --jq '(.can_admins_bypass == false) and (.deployment_branch_policy.protected_branches == true) and ([.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length) > 0)] | length > 0)')
          test "$protected" = true || { echo "real-prod requires protected branches, a non-self reviewer, and no administrator bypass." >&2; exit 1; }

  deploy:
    needs: preflight
    runs-on:
      group: demo-real-deploy
      labels: [self-hosted, linux, x64, demo-real-deploy]
    environment: real-prod
    timeout-minutes: 15
    steps:
      - name: Check out the trusted deployment implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Verify provenance and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.REAL_DEPLOY_ENABLED }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash scripts/deploy-container.sh
