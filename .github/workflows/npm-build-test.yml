name: NPM Build and Test

on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'candidate_controller/**'
      - 'candidate_simulation/**'
      - 'component_ci/**'
      - 'contracts/**'
      - 'production_simulation/**'
      - 'tests/**'
      - '*.md'
      - '**/*.md'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-build-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: NPM Build and Test / validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect NPM project and scripts
        id: detect
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "package_json=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package_json=true" >> "$GITHUB_OUTPUT"
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import re
          with open("package.json", encoding="utf-8") as package_file:
              scripts = json.load(package_file).get("scripts", {})
          for name in ("lint", "test", "build"):
              script = scripts.get(name, "").strip()
              meaningful = bool(script) and not re.search(r"no (lint|test|build) specified", script, re.I)
              print(f"has_{name}={str(meaningful).lower()}")
          PYTHON

      - name: Fail for missing package descriptor
        if: steps.detect.outputs.package_json != 'true'
        run: |
          echo "This required npm workflow needs package.json at the repository root." >&2
          exit 1

      - name: Set up Node.js with dependency cache
        if: steps.detect.outputs.has_lockfile == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Node.js
        if: steps.detect.outputs.package_json == 'true' && steps.detect.outputs.has_lockfile != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.detect.outputs.package_json == 'true'
        run: |
          if [ "${{ steps.detect.outputs.has_lockfile }}" = "true" ]; then npm ci; else npm install; fi

      - name: Run lint
        if: steps.detect.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run tests
        if: steps.detect.outputs.has_test == 'true'
        run: npm test

      - name: Run build
        if: steps.detect.outputs.has_build == 'true'
        run: npm run build

      - name: Require meaningful validation
        if: steps.detect.outputs.package_json == 'true' && steps.detect.outputs.has_lint != 'true' && steps.detect.outputs.has_test != 'true' && steps.detect.outputs.has_build != 'true'
        run: |
          echo "package.json has no meaningful lint, test, or build script." >&2
          exit 1

      - name: Audit locked production dependencies
        if: steps.detect.outputs.has_lockfile == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Write summary
        if: always()
        run: |
          {
            echo "## NPM Build and Test Summary"
            if [ "${{ steps.detect.outputs.package_json }}" != "true" ]; then
              echo "- :x: Missing required \`package.json\`."
            else
              echo "- Dependencies: \`${{ steps.detect.outputs.has_lockfile == 'true' && 'npm ci' || 'npm install' }}\`."
              [ "${{ steps.detect.outputs.has_lockfile }}" = "true" ] || echo "- :warning: No supported lockfile; \`npm install\` is non-reproducible."
              [ "${{ steps.detect.outputs.has_lint }}" = "true" ] && echo "- Ran \`npm run lint\`." || echo "- Skipped \`lint\`: not meaningfully configured."
              [ "${{ steps.detect.outputs.has_test }}" = "true" ] && echo "- Ran \`npm test\`." || echo "- Skipped \`test\`: not meaningfully configured."
              [ "${{ steps.detect.outputs.has_build }}" = "true" ] && echo "- Ran \`npm run build\`." || echo "- Skipped \`build\`: not meaningfully configured."
              if [ "${{ steps.detect.outputs.has_lockfile }}" = "true" ]; then echo "- Ran \`npm audit --omit=dev --audit-level=high\`."; else echo "- Skipped audit: no supported npm lockfile."; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
